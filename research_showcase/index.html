area": "kolkata", "method": "mixture_cvar95", "pairs": "15", "changed": "0", "mean_delta_cvar95_seconds": "0.0", "mean_delta_mean_seconds": "0.0"}, {"area": "kolkata", "method": "worst_model_cvar95", "pairs": "15", "changed": "0", "mean_delta_cvar95_seconds": "0.0", "mean_delta_mean_seconds": "0.0"}, {"area": "pune", "method": "iid_cvar95", "pairs": "15", "changed": "4", "mean_delta_cvar95_seconds": "-4.179602364083178", "mean_delta_mean_seconds": "0.49336526237430955"}, {"area": "pune", "method": "minimax_regret_cvar95", "pairs": "15", "changed": "5", "mean_delta_cvar95_seconds": "-6.513801816201169", "mean_delta_mean_seconds": "1.402736982235632"}, {"area": "pune", "method": "mixture_cvar95", "pairs": "15", "changed": "4", "mean_delta_cvar95_seconds": "-4.179602364083178", "mean_delta_mean_seconds": "0.49336526237430955"}, {"area": "pune", "method": "worst_model_cvar95", "pairs": "15", "changed": "1", "mean_delta_cvar95_seconds": "-0.3136151367039664", "mean_delta_mean_seconds": "-0.01915199473295767"}]}</script><script>
const data=JSON.parse(document.getElementById('embedded').textContent),images=data.images;const imported=[];
const find=(prefix,contains)=>images.find(x=>x.group===prefix&&x.src.toLowerCase().includes(contains.toLowerCase()));
const slide=(section,title,intro,points,img=null,note='',chips=[])=>({section,title,intro,points,img,note,chips});
const S=[
slide('Introduction','Beyond the shortest path','How do we select a route when travel time is uncertain, roads may experience extreme delays, and the shortest expected path may not be the safest?', ['<b>Research question:</b> When does risk-aware routing choose a different path from Dijkstra?','<b>Approach:</b> Compare classical, stochastic, CVaR, and robust objectives on synthetic and real road networks.','<b>Evidence:</b> Actual saved experiment plots and route-disagreement audits.'],find('phase151','controlled_risk_tradeoff'),'The controlled two-route example is synthetic and is not evidence of city-wide performance.', ['Algorithms','Monte Carlo','Risk','Real OSM roads']),
slide('Foundations','Phase 1–3 · Build the routing foundation','We began with graphs, edge weights, shortest-path baselines, and a reproducible experiment structure.', ['<b>Graph model:</b> Intersections or abstract nodes are vertices; roads or links are weighted edges.','<b>Dijkstra:</b> Minimizes the sum of deterministic edge weights.','<b>Experimental discipline:</b> Baselines and graph topology must be held fixed when comparing decision rules.'],find('phase151','synthetic_grid_1'),'Early-phase description summarizes the project workflow; this figure comes from the later Phase 15.1 audit.'),
slide('Foundations','Phase 4–6 · Model uncertainty','Travel times are random variables. A method can optimize average travel time, tail loss, or worst-case behavior.', ['<b>Expected cost:</b> E[T(P)] for path P.','<b>CVaR95:</b> Expected travel time in the worst 5% tail.','<b>Robust routing:</b> Protects against specified model uncertainty rather than assuming one distribution is always correct.'],find('phase13','pune_pair0_rho0.65_monte_carlo_hist'),'These are simulated travel-time uncertainties, not observed traffic measurements.'),
slide('Synthetic networks','Phase 7 · Erdős–Rényi topology','Random connectivity provides a baseline topology for understanding route-selection behavior.', ['<b>Observed Phase 15.1 audit:</b> 0 disagreements across 24 recorded method comparisons.','<b>Interpretation:</b> Different objectives can legitimately choose the same route.','<b>Important:</b> Equal routes do not prove that risk objectives are mathematically identical.'],null,'No disagreement-focused route map exists for this topology because the saved comparisons had no disagreements.'),
slide('Synthetic networks','Phase 7 · Grid topology','Structured paths create more opportunities for competing routes of similar length.', ['<b>Observed:</b> 2 disagreements across 24 recorded method comparisons.','<b>Visualization:</b> Shared road segments versus algorithm-specific segments.','<b>Lesson:</b> Topology can affect whether changing the objective changes the selected path.'],find('phase151','synthetic_grid_1'),'The displayed case is selected because a real disagreement was recorded.'),
slide('Synthetic networks','Phase 7 · Scale-free topology','Hub-dominated connectivity can concentrate routing choices onto the same paths.', ['<b>Observed:</b> 0 disagreements across 24 recorded method comparisons.','<b>Lesson:</b> Algorithm diversity does not guarantee path diversity.','<b>Scientific reporting:</b> Report ties explicitly rather than manufacturing visual differences.'],null,'No disagreement-focused route map exists in the supplied results for this topology.'),
slide('Method development','Phase 8–10 · Stress and robustness','We moved from nominal shortest paths to stochastic and robustness diagnostics, with controlled changes to uncertainty.', ['<b>Monte Carlo SAA:</b> Estimates expected objectives using sampled travel times.','<b>CVaR:</b> Focuses on bad travel-time outcomes.','<b>Distribution shift:</b> Tests whether a route selected under one model remains good under another.'],find('phase13','pune_pair0_rho0.65_cvar_tail'),'Risk-aware methods can outperform or underperform depending on the evaluation distribution.'),
slide('Road networks','Phase 11 · Urban road network','Real road topology introduces one-way streets, network constraints, and alternate corridors.', ['<b>Audit:</b> 15 route disagreements in 60 comparisons.','<b>Map:</b> Shows an actual selected disagreement case.','<b>Evaluation:</b> Compare both the chosen route and its held-out travel-time risk.'],find('phase151','road_urban_1'),'Phase 11 is a separate experiment from the five-city Phase 13 benchmark.'),
slide('Road networks','Phase 11 · Suburban road network','Suburban topology creates different candidate-route options and route-overlap patterns.', ['<b>Audit:</b> 21 route disagreements in 60 comparisons.','<b>Do not infer:</b> More disagreements automatically mean better routes.','<b>Measure:</b> Mean travel time and CVaR95 differences.'],find('phase151','road_suburban_1')),
slide('Road networks','Phase 11 · Constrained road network','Limited connectivity can reduce the number of viable alternatives and magnify the cost of detours.', ['<b>Audit:</b> 12 route disagreements in 60 comparisons.','<b>Route choice:</b> Risk-aware methods may select longer but more reliable alternatives.','<b>Limitation:</b> The candidate-route pool constrains what every algorithm can choose.'],find('phase151','road_constrained_1')),
slide('Robust objectives','Phase 12 · Model-aware risk objectives','The experiment compares decisions optimized for different uncertainty assumptions rather than treating all uncertainty as identical.', ['<b>Standard CVaR:</b> Tail-risk objective under a nominal model.','<b>Mixture CVaR:</b> Tail-risk objective over a mixture model.','<b>Worst-model CVaR:</b> Optimizes against the least favorable specified model.','<b>Minimax CVaR regret:</b> Reduces worst-case loss relative to model-specific optima.'],find('phase13','pune_pair0_rho0.65_routes'),'The methods can agree on a route even though their optimization objectives differ.'),
slide('Five-city benchmark','Phase 13 · Five real city networks','We evaluated 15 origin–destination pairs in each of five OSM road networks using five routing methods and simulated uncertainty.', ['<b>Areas:</b> Pune, Hyderabad, Chennai, Jaipur, Kolkata.','<b>Experiment:</b> 22,500 method records and 75 OD pairs.','<b>Protocol:</b> Nested development sample sizes, model mixing weights, three evaluation shifts, and held-out Monte Carlo draws.'],find('phase13','chennai_pair0_rho0.65_routes'),'Pune and Hyderabad used OSMnx extraction; the other three were built offline from Geofabrik extracts. Cross-city comparisons require this caveat.'),
slide('Five-city benchmark','Phase 13 · Monte Carlo and tail risk','The simulation estimates how each selected path behaves over many plausible travel-time outcomes.', ['<b>Histogram:</b> Distribution of simulated path travel times.','<b>Tail-risk plot:</b> Emphasizes the worst 5% of outcomes.','<b>Convergence:</b> Checks whether Monte Carlo estimates stabilize as more draws are used.'],find('phase13','kolkata_pair0_rho0.65_monte_carlo_hist'),'A histogram illustrates an estimated distribution; it is not an observed traffic dataset.'),
slide('Statistical audit','Phase 14 · Statistical validation','The results were checked using paired comparisons, hierarchical bootstrap intervals, city-level sensitivity, and multiple-testing adjustment.', ['<b>Integrity:</b> Phase 14 data audit passed.','<b>Primary result:</b> None of the 12 comparisons had a Holm-adjusted p-value below 0.05.','<b>Interpretation:</b> Observed differences are descriptive; statistical superiority is not established.'],find('phase15','phase14_primary_intervals'),'Five geographic clusters limit population-level inference.'),
slide('Research visualization','Phase 15 · Comparative scientific figures','Aggregate comparisons help explain whether a routing method changes travel-time risk across cases.', ['<b>Paired effects:</b> Compare method results to the same OD baseline.','<b>Distribution dependence:</b> Heavy-lognormal and correlated-Gamma shifts can lead to different rankings.','<b>Honest plots:</b> Show ties and unfavorable outcomes alongside improvements.'],find('phase15','phase13_pune_paired_effects')),
slide('Route disagreement','Phase 15.1 · Why the routes differ','We intentionally select recorded disagreement cases rather than repeatedly plotting pair 0, where routes often overlap.', ['<b>Shared segments:</b> Show where algorithms agree.','<b>Unique segments:</b> Reveal the actual detour selected by the alternative objective.','<b>Decision quality:</b> A different route is useful only if its evaluation metric improves.'],find('phase151','phase13_pune_1'),'Map routes were reconstructed from cached graphs; the audit warns that changed graph caches can cause mismatches.'),
slide('Route disagreement','Five-city disagreement frequency','The number of disagreements varies substantially by road network and method.', ['<b>Pune:</b> 14 disagreements / 60 comparisons.','<b>Hyderabad:</b> 1 / 60; <b>Chennai:</b> 5 / 60.','<b>Jaipur:</b> 4 / 60; <b>Kolkata:</b> 6 / 60.'],find('phase151','pune_method_deltas'),'Counts are from the supplied Phase 15.1 audit, not a claim of algorithm superiority.'),
slide('Controlled experiment','Controlled two-route stress test','A short, delay-prone route and a longer, more reliable route can lead to different optimal decisions.', ['<b>Dijkstra:</b> May prefer the route with lower nominal or expected travel time.','<b>CVaR:</b> Can prefer the alternative with less severe extreme delays.','<b>Purpose:</b> Demonstrate the mechanism clearly, separately from real-road evidence.'],find('phase151','controlled_risk_tradeoff'),'Illustrative synthetic stress test only; not a measured outcome for Pune or any other city.'),
slide('Conclusions','What did the research establish?','The contribution is a careful comparison of when risk-aware routing changes decisions—and whether those decisions help.', ['<b>Result:</b> Different algorithms often choose the same route.','<b>Result:</b> Heavy-tailed and correlated uncertainty can reverse relative performance.','<b>Result:</b> More stable decisions do not necessarily imply lower tail risk.','<b>Next:</b> Finalize reproducibility documentation, limitations, and manuscript claims.'],find('phase151','kolkata_method_deltas'),'No universal algorithm winner is supported by the current evidence.'),
slide('Explore evidence','Actual figures · Browse the experiment archive','Explore the images generated by your Python research pipeline. Click any thumbnail to enlarge it.', ['<b>Phase 13:</b> OSM route maps, Monte Carlo histograms, tail-risk plots, and convergence.','<b>Phase 15:</b> Statistical and paired-effect figures.','<b>Phase 15.1:</b> Disagreement maps for synthetic, Phase 11, and five-city networks.'],null,'Every image in this gallery is bundled from your uploaded research result ZIPs.')
];

function nav(){ $('nav').innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===index?'active':''}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${escapeHtml(s.title)}</span></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('nav').querySelector('.active')?.scrollIntoView({block:'nearest'});}
function renderGallery(){const groups=[['all','All figures'],['phase151','Route disagreement'],['phase13','Monte Carlo'],['phase15','Research plots'],['imported','Imported folder']];let list=[...images,...imported].filter(x=>filter==='all'||x.group===filter);return `<div class="galleryBar">${groups.map(([v,n])=>`<button data-filter="${v}" class="${filter===v?'active':''}">${n}</button>`).join('')}</div><div class="gallery">${list.map(x=>`<button class="thumb" data-src="${escapeHtml(x.src)}" title="${escapeHtml(x.source)}"><img loading="lazy" src="${escapeHtml(x.src)}" alt="${escapeHtml(x.title)}"><span>${escapeHtml(x.title)}</span></button>`).join('')}</div>`;}
function render(){const s=S[index];$('chapter').textContent=s.section.toUpperCase();$('count').textContent=`${index+1} / ${S.length}`;$('progress').style.width=`${100*(index+1)/S.length}%`;$('stage').innerHTML=`<article class="slide"><div class="slideLabel">${escapeHtml(s.section)} · ${String(index+1).padStart(2,'0')}</div><h1>${escapeHtml(s.title)}</h1><p class="intro">${escapeHtml(s.intro)}</p>${s.chips?.length?`<div class="chips">${s.chips.map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('')}</div>`:''}<div class="layout"><div>${s.title.startsWith('Actual figures')?renderGallery():s.img?`<div class="media"><img src="${escapeHtml(s.img.src)}" alt="${escapeHtml(s.img.title)}"><div class="mediaFooter"><span>Actual figure · ${escapeHtml(s.img.source)}</span><button id="zoom">⤢ Enlarge</button></div></div>`:`<div class="panel empty"><div style="font-size:48px;margin-bottom:10px">◎</div>No recorded disagreement figure for this experiment.<br>We show the observed tie rather than inventing a different route.</div>`}</div><div class="panel"><div class="sideTitle">WHAT THIS SLIDE EXPLAINS</div><div class="points">${s.points.map((p,i)=>`<div class="point"><span style="color:var(--teal);font-size:11px">${String(i+1).padStart(2,'0')}</span> &nbsp; ${p}</div>`).join('')}</div>${s.note?`<div class="note"><b>Research caveat</b><br>${escapeHtml(s.note)}</div>`:''}</div></div></article>`;$('stage').scrollTop=0;nav();$('zoom')?.addEventListener('click',()=>openModal(s.img.src));$('stage').querySelectorAll('.thumb').forEach(el=>el.onclick=()=>openModal(el.dataset.src));$('stage').querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});}
function go(i){index=(i+S.length)%S.length;render();if(playing)restart();}function tick(){if(index===S.length-1){pause();return}go(index+1)}function restart(){clearInterval(timer);timer=setInterval(tick,Number($('speed').value));}function play(){playing=true;$('play').textContent='❚❚ Pause';$('status').textContent='Auto-playing';restart()}function pause(){playing=false;clearInterval(timer);$('play').textContent='▶ Auto-play';$('status').textContent='Manual mode'}function openModal(src){$('modalImg').src=src;$('modal').classList.add('open');if(playing)pause()}$('importFolder').onclick=()=>$('folderPicker').click();$('folderPicker').onchange=e=>{imported.forEach(x=>URL.revokeObjectURL(x.src));imported.length=0;for(const f of e.target.files){if(f.type.startsWith('image/'))imported.push({src:URL.createObjectURL(f),title:f.webkitRelativePath||f.name,source:'Imported local folder / '+(f.webkitRelativePath||f.name),group:'imported'})}filter='imported';go(S.length-1)};$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('play').onclick=()=>playing?pause():play();$('speed').onchange=()=>{if(playing)restart()};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('closeModal').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key===' '){e.preventDefault();playing?pause():play()}if(e.key.toLowerCase()==='f')$('fullscreen').click();if(e.key==='Escape')$('modal').classList.remove('open')});render();
